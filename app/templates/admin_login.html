{% extends "base.html" %}
{% block title %}Admin login · Graham &amp; Doddsville{% endblock %}
{% block footer_note %}{% endblock %}
{% block breadcrumb %}
<a href="{{ prefix }}/" class="text-sm text-indigo-600 hover:underline">&larr; Dashboard</a>
{% endblock %}
{% block body %}

<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-bold text-center -mt-2 mb-6">Admin login</h1>
  <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    {% if error %}
    <p class="text-sm text-rose-600 mb-3">Wrong password.</p>
    {% endif %}
    <form method="post" action="{{ prefix }}/admin/login" class="space-y-3">
      <input type="password" name="password" required autofocus placeholder="Password"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 ring-indigo-500" />
      <button class="w-full px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500">Log in</button>
    </form>
  </section>
</div>

{% endblock %}
